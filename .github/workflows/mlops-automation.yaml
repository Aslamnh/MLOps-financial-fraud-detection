name: mlops-automation

# Code as a Trigger: setiap perubahan kode memicu pengujian, pelatihan ulang,
# evaluasi, dan pendaftaran model ke registry secara otomatis.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Tahap 1 - Automated Testing"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Jalankan pytest
        run: python -m pytest tests -v

  train-evaluate-register:
    name: "Tahap 2-4 - Training, Evaluasi, Registry"
    needs: test
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ambil data terbaru dari DVC (Backblaze B2)
        run: python -m dvc pull data/processed.dvc

      - name: "Tahap 2 - Automated Training"
        run: python src/train.py --no-register

      - name: "Tahap 3 - Evaluasi dan validasi terhadap threshold"
        run: python src/evaluate_model.py

      - name: "Tahap 4 - Auto-registry ke Staging"
        run: python src/register_staging.py
        env:
          GIT_COMMIT: ${{ github.sha }}

      - name: Simpan hasil sebagai artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hasil-pipeline
          path: |
            models/best_model_metadata.json
            models/evaluation_report.json
            models/staging_registration.json
            mlflow.db
          if-no-files-found: ignore
